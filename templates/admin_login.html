<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #333;}
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        input[type="password"] { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background: #dc2626; color: white; padding: 12px; width: 100%; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #b91c1c; }
        .error { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px;}
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 Restricted Area</h2>
        <p style="color: gray; font-size: 14px;">Enter the Local Admin Password to continue.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="error">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/admin-login">
            <input type="password" name="password" placeholder="Admin Password" required>
            <button type="submit" class="btn">Unlock Settings</button>
        </form>
        <br>
        <a href="/" style="color: #2563eb; font-size: 14px; text-decoration: none;">← Back to Dashboard</a>
    </div>
</body>
</html>
